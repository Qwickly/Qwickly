openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Bookza SaaS Booking Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary operations
  - name: bookings
    description: Booking management
  - name: clients
    description: Client CRM
  - name: services
    description: Service catalog
  - name: staff
    description: Staff management
  - name: payments
    description: Payment and finance
  - name: analytics
    description: Analytics and reporting
  - name: whatsapp
    description: WhatsApp integration
  - name: calendar
    description: Calendar and scheduling

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── DASHBOARD ───────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: KPI cards and top-line metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/revenue-chart:
    get:
      operationId: getRevenueChart
      tags: [dashboard]
      summary: Revenue data for chart
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        "200":
          description: Revenue chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueDataPoint"

  /dashboard/popular-services:
    get:
      operationId: getPopularServices
      tags: [dashboard]
      summary: Top services by bookings and revenue
      responses:
        "200":
          description: Popular services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopularService"

  /dashboard/activity-feed:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      summary: Recent activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/calendar-overview:
    get:
      operationId: getCalendarOverview
      tags: [dashboard]
      summary: Today, tomorrow, and upcoming week bookings
      responses:
        "200":
          description: Calendar overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarOverview"

  # ── BOOKINGS ────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: getBookings
      tags: [bookings]
      summary: List all bookings with filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmed, pending, cancelled, completed, no_show]
        - name: staffId
          in: query
          schema:
            type: ["integer", "null"]
        - name: serviceId
          in: query
          schema:
            type: ["integer", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a single booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled

  /bookings/{id}/confirm:
    post:
      operationId: confirmBooking
      tags: [bookings]
      summary: Confirm a pending booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/send-whatsapp:
    post:
      operationId: sendBookingWhatsapp
      tags: [bookings]
      summary: Send a WhatsApp message for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappMessageInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappMessageResult"

  # ── CLIENTS ─────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: getClients
      tags: [clients]
      summary: List clients
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, new, returning, vip, no_show_risk]
            default: all
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a single client with full profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfile"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}/ai-insights:
    get:
      operationId: getClientAiInsights
      tags: [clients]
      summary: AI-generated insights for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiInsight"

  # ── SERVICES ────────────────────────────────────────────────────────────
  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List all services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Archive a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  # ── STAFF ───────────────────────────────────────────────────────────────
  /staff:
    get:
      operationId: getStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Add a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    get:
      operationId: getStaffMember
      tags: [staff]
      summary: Get staff member profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
    patch:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}/schedule:
    get:
      operationId: getStaffSchedule
      tags: [staff]
      summary: Get staff weekly schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSchedule"
    put:
      operationId: updateStaffSchedule
      tags: [staff]
      summary: Update staff weekly schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSchedule"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSchedule"

  # ── PAYMENTS ────────────────────────────────────────────────────────────
  /payments:
    get:
      operationId: getPayments
      tags: [payments]
      summary: List transactions
      parameters:
        - name: method
          in: query
          schema:
            type: ["string", "null"]
            enum: [payfast, yoco, cash, eft, null]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [completed, pending, refunded, failed, null]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/summary:
    get:
      operationId: getPaymentsSummary
      tags: [payments]
      summary: Finance KPI cards
      responses:
        "200":
          description: Payment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSummary"

  # ── ANALYTICS ───────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Overall analytics metrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/ai-insights:
    get:
      operationId: getAnalyticsInsights
      tags: [analytics]
      summary: AI-generated business insights
      responses:
        "200":
          description: AI insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiInsight"

  # ── WHATSAPP ────────────────────────────────────────────────────────────
  /whatsapp/reminders:
    get:
      operationId: getWhatsappReminders
      tags: [whatsapp]
      summary: List scheduled and sent reminders
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsappReminder"

  /whatsapp/templates:
    get:
      operationId: getWhatsappTemplates
      tags: [whatsapp]
      summary: List message templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsappTemplate"
    post:
      operationId: createWhatsappTemplate
      tags: [whatsapp]
      summary: Create a message template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappTemplate"

  /whatsapp/templates/{id}:
    patch:
      operationId: updateWhatsappTemplate
      tags: [whatsapp]
      summary: Update a message template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappTemplate"

  /whatsapp/conversations:
    get:
      operationId: getWhatsappConversations
      tags: [whatsapp]
      summary: List WhatsApp conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsappConversation"

  /whatsapp/conversations/{id}/messages:
    get:
      operationId: getWhatsappMessages
      tags: [whatsapp]
      summary: Get messages for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsappMessage"
    post:
      operationId: sendWhatsappConversationMessage
      tags: [whatsapp]
      summary: Send a WhatsApp message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappMessage"

  /whatsapp/conversations/{id}/read:
    post:
      operationId: markWhatsappConversationRead
      tags: [whatsapp]
      summary: Mark a WhatsApp conversation as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Conversation marked as read

  /whatsapp/bot-stats:
    get:
      operationId: getWhatsappBotStats
      tags: [whatsapp]
      summary: AI bot statistics
      responses:
        "200":
          description: Bot stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappBotStats"

  # ── CALENDAR ────────────────────────────────────────────────────────────
  /calendar/events:
    get:
      operationId: getCalendarEvents
      tags: [calendar]
      summary: Get calendar events for a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: ["integer", "null"]
        - name: serviceId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── DASHBOARD SCHEMAS ──────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - todayAppointments
        - revenueThisMonth
        - upcomingBookings
        - noShowRate
        - todayAppointmentsChange
        - revenueChange
        - upcomingChange
        - noShowChange
      properties:
        todayAppointments:
          type: integer
        revenueThisMonth:
          type: number
        upcomingBookings:
          type: integer
        noShowRate:
          type: number
        todayAppointmentsChange:
          type: number
        revenueChange:
          type: number
        upcomingChange:
          type: number
        noShowChange:
          type: number

    RevenueDataPoint:
      type: object
      required: [date, revenue, bookings]
      properties:
        date:
          type: string
        revenue:
          type: number
        bookings:
          type: integer

    PopularService:
      type: object
      required: [id, name, bookingCount, revenue, percentageOfTotal]
      properties:
        id:
          type: integer
        name:
          type: string
        bookingCount:
          type: integer
        revenue:
          type: number
        percentageOfTotal:
          type: number

    ActivityItem:
      type: object
      required: [id, type, message, timestamp, clientName]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [booking, payment, reminder, cancellation, review]
        message:
          type: string
        clientName:
          type: string
        timestamp:
          type: string
        avatarUrl:
          type: ["string", "null"]

    CalendarOverview:
      type: object
      required: [today, tomorrow, thisWeek]
      properties:
        today:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        tomorrow:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        thisWeek:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"

    # ── BOOKING SCHEMAS ────────────────────────────────────────────────────
    Booking:
      type: object
      required:
        - id
        - clientId
        - clientName
        - serviceId
        - serviceName
        - staffId
        - staffName
        - startTime
        - endTime
        - status
        - depositPaid
        - depositAmount
        - totalAmount
        - createdAt
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        clientPhone:
          type: ["string", "null"]
        serviceId:
          type: integer
        serviceName:
          type: string
        staffId:
          type: integer
        staffName:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
          enum: [confirmed, pending, cancelled, completed, no_show]
        depositPaid:
          type: boolean
        depositAmount:
          type: number
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    BookingInput:
      type: object
      required: [clientId, serviceId, staffId, startTime]
      properties:
        clientId:
          type: integer
        serviceId:
          type: integer
        staffId:
          type: integer
        startTime:
          type: string
        notes:
          type: ["string", "null"]
        depositRequired:
          type: boolean

    BookingUpdate:
      type: object
      properties:
        startTime:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          enum: [confirmed, pending, cancelled, completed, no_show, null]
        notes:
          type: ["string", "null"]
        depositPaid:
          type: ["boolean", "null"]

    # ── CLIENT SCHEMAS ─────────────────────────────────────────────────────
    Client:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - totalSpent
        - lifetimeBookings
        - lastBookingDate
        - clientType
        - noShowCount
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        totalSpent:
          type: number
        lifetimeBookings:
          type: integer
        lastBookingDate:
          type: ["string", "null"]
        clientType:
          type: string
          enum: [new, returning, vip, no_show_risk]
        noShowCount:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    ClientProfile:
      type: object
      required: [client, recentBookings, payments, notes]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ClientNote"
        aiInsights:
          type: array
          items:
            $ref: "#/components/schemas/AiInsight"

    ClientNote:
      type: object
      required: [id, content, createdAt]
      properties:
        id:
          type: integer
        content:
          type: string
        createdAt:
          type: string

    ClientInput:
      type: object
      required: [name, phone]
