# railway.toml — Railway deployment config for the Bookza frontend service
#
# Railway should use the frontend Docker image and start the production server
# from /opt/app/artifacts/bookza. This avoids falling back to the old API
# entrypoint or a stale command from the dashboard.

[deploy]
startCommand = "sh ./start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
