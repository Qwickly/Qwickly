# nixpacks.toml — Fallback Nixpacks config (only used if Railway doesn't detect Dockerfile)
# Primary build path: root Dockerfile (preferred — handles workspace deps correctly)

[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["npm install -g pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/bookza run build"]

[start]
cmd = "node /opt/app/artifacts/bookza/server.js"
